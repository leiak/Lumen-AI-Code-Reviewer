spring:
  application:
    name: lumen-ai-code-reviewer
  config:
    # 加载项目根的 .env（不存在不报错）。Spring Boot 3.0+ 原生支持。
    # .env 已 .gitignore；.env.example 是模板。
    import: "optional:file:.env[.properties]"
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration

server:
  port: 8080
  error:
    include-message: always

review:
  data-dir: ${REVIEW_DATA_DIR:./.review-data}
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      # Spring AI 在 baseUrl 后面拼 /v1/chat/completions，**不能带 /v1** 否则 404
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat}
      model: ${MINIMAX_MODEL:MiniMax-Text-01}

spring.ai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    chat:
      options:
        model: claude-sonnet-5-20250929
  openai:
    api-key: ${OPENAI_API_KEY:}
    chat:
      options:
        model: gpt-5
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat:
      options:
        model: ${OLLAMA_MODEL:qwen2.5-coder:32b}

logging:
  level:
    com.review.council: INFO
    org.bsc.langgraph4j: WARN
